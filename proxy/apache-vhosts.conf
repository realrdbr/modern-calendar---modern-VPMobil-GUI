# Enable mod_ssl, mod_proxy, mod_proxy_http, mod_proxy_wstunnel and headers.
# Replace certificate paths before enabling this file.
# ProxyRequests must remain Off: this is a reverse proxy only.

ProxyRequests Off

<VirtualHost *:443>
    ServerName cal11.de
    SSLEngine On
    SSLCertificateFile /etc/letsencrypt/live/cal11.de/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/cal11.de/privkey.pem

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:3000/ connectiontimeout=5 timeout=60
    ProxyPassReverse / http://127.0.0.1:3000/
    RequestHeader set X-Forwarded-Proto "https"
</VirtualHost>

<VirtualHost *:443>
    ServerName vp.cal11.de
    SSLEngine On
    SSLCertificateFile /etc/letsencrypt/live/vp.cal11.de/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/vp.cal11.de/privkey.pem

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8000/ connectiontimeout=5 timeout=60
    ProxyPassReverse / http://127.0.0.1:8000/
    RequestHeader set X-Forwarded-Proto "https"
</VirtualHost>

<VirtualHost *:443>
    ServerName notify.cal11.de
    SSLEngine On
    SSLCertificateFile /etc/letsencrypt/live/notify.cal11.de/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/notify.cal11.de/privkey.pem

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8090/ upgrade=websocket connectiontimeout=5 timeout=3600
    ProxyPassReverse / http://127.0.0.1:8090/
    RequestHeader set X-Forwarded-Proto "https"
</VirtualHost>

<VirtualHost *:80>
    ServerName cal11.de
    Redirect permanent / https://cal11.de/
</VirtualHost>

<VirtualHost *:80>
    ServerName vp.cal11.de
    Redirect permanent / https://vp.cal11.de/
</VirtualHost>

<VirtualHost *:80>
    ServerName notify.cal11.de
    Redirect permanent / https://notify.cal11.de/
</VirtualHost>
