# Include this file from the nginx `http` context.
#
# TLS-Zertifikate mit Let's Encrypt (certbot) erstellen:
# 1) DNS muss auf diesen Server zeigen:
#    - cal11.de
#    - vp.cal11.de
#    - notify.cal11.de
# 2) Port 80/443 in der Firewall öffnen.
# 3) Nginx kurz stoppen (nur beim ersten standalone-Ausstellen nötig):
#    sudo systemctl stop nginx
# 4) Zertifikate ausstellen:
#    sudo certbot --nginx -d cal11.de -d vp.cal11.de -d notify.cal11.de
# 5) Nginx wieder starten:
#    sudo systemctl start nginx
# 6) Danach unten die Platzhalter bei `ssl_certificate` und `ssl_certificate_key`
#    durch die echten Dateien aus `/etc/letsencrypt/live/...` ersetzen.
#    Beispiel:
#    ssl_certificate /etc/letsencrypt/live/cal11.de/fullchain.pem;
#    ssl_certificate_key /etc/letsencrypt/live/cal11.de/privkey.pem;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name cal11.de;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name cal11.de;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Kalender-Uploads erlauben (Backend-Limit: 10 MB).
        client_max_body_size 12m;
        proxy_request_buffering off;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

server {
    listen 80;
    server_name vp.cal11.de;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name vp.cal11.de;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    server_name notify.cal11.de;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name notify.cal11.de;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        client_max_body_size 0;
    }
}
