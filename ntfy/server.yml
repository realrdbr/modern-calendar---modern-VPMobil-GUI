# Private ntfy-Instanz. Nutzer und ihre individuellen Leserechte werden durch
# `admin.py create-user` mit der ntfy-CLI angelegt.
#
# WICHTIG: auth-default-access und behind-proxy werden NICHT hier hart
# gesetzt, sondern bewusst aus der .env über die Compose-Environment-Variablen
# NTFY_AUTH_DEFAULT_ACCESS / NTFY_BEHIND_PROXY injiziert (siehe docker-compose.yml
# und ntfy-compose.yml). ntfy-Umgebungsvariablen überschreiben die Werte aus
# dieser Datei, damit sich lokale und produktive Umgebung nur über die .env
# unterscheiden müssen, ohne server.yml anzupassen.
#
# Bei einem Reverse Proxy NTFY_BEHIND_PROXY=true setzen.
# Im vollständigen Compose-Stack läuft der VP-Versand über ein eigenes internes
# Netzwerk. Nur dessen feste VP-IP ist vom Request-Limit ausgenommen
# (NTFY_VISITOR_REQUEST_LIMIT_EXEMPT_HOSTS); Authentifizierung und ACLs gelten weiter.
#
# Selbst gehostetes ntfy benötigt diesen Upstream für sofortige iOS-Pushs.
upstream-base-url: "https://ntfy.sh"
# Der ntfy-Manager entfernt den Verlauf rollierend nach ungefähr 23 Stunden.
# So bleiben Benachrichtigungen kurz nachvollziehbar, alte Tage verschwinden
# aber automatisch aus der App, ohne direkte SQLite-Manipulation bei laufendem ntfy.
cache-duration: "23h"
manager-interval: "1m"
# Nur authentifizierte Nutzer dürfen veröffentlichen/abonnieren (siehe oben,
# effektiver Wert kommt aus NTFY_AUTH_DEFAULT_ACCESS).

# Öffentliche Requests bleiben begrenzt. Der interne VP-Versand benötigt eine
# separate Ausnahme, da ein großer Versandlauf das Request-Kontingent erschöpft.
visitor-request-limit-burst: 120
visitor-request-limit-replenish: "5s"

# Offene Abos; eine Erhöhung behebt KEINE HTTP-429-Fehler beim Publish.
visitor-subscription-limit: 250
