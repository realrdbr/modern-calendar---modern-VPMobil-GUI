# Private ntfy-Instanz. Nutzer und ihre individuellen Leserechte werden durch
# `admin.py create-user` mit der ntfy-CLI angelegt.
auth-default-access: "deny-all"
# Selbst gehostetes ntfy benötigt diesen Upstream für sofortige iOS-Pushs.
upstream-base-url: "https://ntfy.sh"
# Der ntfy-Manager entfernt den Verlauf rollierend nach ungefähr 23 Stunden.
# So bleiben Benachrichtigungen kurz nachvollziehbar, alte Tage verschwinden
# aber automatisch aus der App, ohne direkte SQLite-Manipulation bei laufendem ntfy.
cache-duration: "23h"
manager-interval: "1m"
# Nur authentifizierte Nutzer dürfen veröffentlichen/abonnieren.
