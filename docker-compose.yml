services:
  mariadb:
    image: mariadb:11.4
    container_name: ${MARIADB_CONTAINER_NAME:-mariadb}
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --max-connections=100
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-super_root_passwort_hier}
      MYSQL_DATABASE: ${DB_NAME:-cal11}
      MYSQL_USER: ${DB_USER:-cal11user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-geheimes_passwort_hier_eintragen}
    volumes:
      - mariadb_data:/var/lib/mysql
    ports:
      - "${HOST_DB_PORT:-127.0.0.1:3306}:3306"
    networks:
      - cal11_net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${APP_CONTAINER_NAME:-cal11_app}
    restart: unless-stopped
    depends_on:
      - mariadb
    environment:
      HOST: ${HOST:-0.0.0.0}
      BIND_HOST: ${BIND_HOST:-0.0.0.0}
      CAL11_PORT: ${CAL11_PORT:-3000}
      VP_PORT: ${VP_PORT:-8000}
      PORT: ${CAL11_PORT:-3000}
      NODE_ENV: ${NODE_ENV:-production}
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_USER: ${DB_USER:-cal11user}
      DB_PASSWORD: ${DB_PASSWORD:-geheimes_passwort_hier_eintragen}
      DB_NAME: ${DB_NAME:-cal11}
      CALENDAR_PUBLIC_URL: ${CALENDAR_PUBLIC_URL:-http://127.0.0.1:3000}
      VERTRETUNGSPLAN_PUBLIC_URL: ${VERTRETUNGSPLAN_PUBLIC_URL:-http://127.0.0.1:8000}
      VITE_VERTRETUNGSPLAN_URL: ${VERTRETUNGSPLAN_PUBLIC_URL:-http://127.0.0.1:8000}
      VITE_KALENDER_URL: ${CALENDAR_PUBLIC_URL:-http://127.0.0.1:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Berlin}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?APP_ENCRYPTION_KEY muss gesetzt sein}
      CALENDAR_PRIVATE_DATA_KEY: ${CALENDAR_PRIVATE_DATA_KEY:-}
    ports:
      - "127.0.0.1:${CAL11_PORT:-3000}:${CAL11_PORT:-3000}"
    networks:
      - cal11_net

  ntfy:
    image: binwiederhier/ntfy:v2.25.0
    container_name: ${NTFY_CONTAINER_NAME:-vpmobil-ntfy}
    command: serve
    restart: unless-stopped
    environment:
      NTFY_BASE_URL: ${NTFY_PUBLIC_URL:-http://127.0.0.1:8090}
      NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
      NTFY_AUTH_FILE: /var/lib/ntfy/auth.db
      NTFY_AUTH_DEFAULT_ACCESS: ${NTFY_AUTH_DEFAULT_ACCESS:-deny-all}
      NTFY_ENABLE_LOGIN: "true"
      NTFY_ENABLE_SIGNUP: "false"
      NTFY_BEHIND_PROXY: ${NTFY_BEHIND_PROXY:-false}
    volumes:
      - ./data/ntfy:/var/lib/ntfy
      - ./ntfy/server.yml:/etc/ntfy/server.yml:ro
    ports:
      - "127.0.0.1:${NTFY_PORT:-8090}:80"
    networks:
      - cal11_net

  ntfy-provisioner:
    build:
      context: .
      dockerfile: Dockerfile.ntfy-provisioner
    container_name: ${NTFY_PROVISIONER_CONTAINER_NAME:-vpmobil-ntfy-provisioner}
    restart: unless-stopped
    depends_on:
      - ntfy
    environment:
      NTFY_AUTH_FILE: /var/lib/ntfy/auth.db
      NTFY_PROVISIONER_SECRET: ${APP_ENCRYPTION_KEY:?APP_ENCRYPTION_KEY muss gesetzt sein}
    volumes:
      - ./data/ntfy:/var/lib/ntfy
    networks:
      - cal11_net

  vp:
    build:
      context: .
      dockerfile: Dockerfile.vp
    container_name: ${VP_CONTAINER_NAME:-cal11_vp}
    restart: unless-stopped
    depends_on:
      - mariadb
      - ntfy
      - ntfy-provisioner
    environment:
      HOST: ${HOST:-0.0.0.0}
      BIND_HOST: ${BIND_HOST:-0.0.0.0}
      VP_PORT: ${VP_PORT:-8000}
      PORT: ${VP_PORT:-8000}
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_USER: ${DB_USER:-cal11user}
      DB_PASSWORD: ${DB_PASSWORD:-geheimes_passwort_hier_eintragen}
      DB_NAME: ${DB_NAME:-cal11}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?APP_ENCRYPTION_KEY muss gesetzt sein}
      CALENDAR_PRIVATE_DATA_KEY: ${CALENDAR_PRIVATE_DATA_KEY:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Berlin}
      NTFY_PUBLIC_URL: ${NTFY_PUBLIC_URL:-http://127.0.0.1:8090}
      NTFY_INTERNAL_URL: ${NTFY_INTERNAL_URL:-http://ntfy}
      NTFY_AUTOSTART: "false"
      NTFY_PROVISIONER_URL: http://ntfy-provisioner:8080
      NTFY_PROVISIONER_SECRET: ${APP_ENCRYPTION_KEY:?APP_ENCRYPTION_KEY muss gesetzt sein}
      NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
      NTFY_HISTORY_CLEANUP_MARKER: /var/lib/ntfy/.history-cleanup-date
      CALENDAR_PUBLIC_URL: ${CALENDAR_PUBLIC_URL:-http://127.0.0.1:3000}
      VERTRETUNGSPLAN_PUBLIC_URL: ${VERTRETUNGSPLAN_PUBLIC_URL:-http://127.0.0.1:8000}
      SCHULNUMMER: ${SCHULNUMMER}
      BENUTZERNAME: ${BENUTZERNAME}
      PASSWORT: ${PASSWORT}
      GOOD_ROOMS: ${GOOD_ROOMS}
      MEDIUM_ROOMS: ${MEDIUM_ROOMS}
      BAD_ROOMS: ${BAD_ROOMS}
      ALL_ROOMS: ${ALL_ROOMS}
    ports:
      - "127.0.0.1:${VP_PORT:-8000}:${VP_PORT:-8000}"
    volumes:
      - ./data/ntfy:/var/lib/ntfy
    networks:
      - cal11_net

  proxy:
    image: caddy:2.8
    container_name: ${PROXY_CONTAINER_NAME:-cal11_proxy}
    restart: unless-stopped
    profiles:
      - proxy
    depends_on:
      - app
      - vp
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - cal11_net

volumes:
  mariadb_data:
    name: ${DB_VOLUME_NAME:-mariadb_data}
  caddy_data:
    driver: local
  caddy_config:
    driver: local

networks:
  cal11_net:
    name: ${DOCKER_NET_NAME:-cal11_net}
    driver: bridge
